<style>
.wb-video { position: relative; aspect-ratio: var(--wb-video-ratio, 16 / 9); overflow: hidden; background: #000; border-radius: var(--wb-radius, 0.25rem); }
.wb-video iframe, .wb-video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.wb-video-note { margin: 0.5rem 0 0; font-size: 0.875em; }
</style>

<!-- A: YouTube (privacy-enhanced address). Keep this block or delete it.
     Replace the whole src with https://www.youtube-nocookie.com/embed/ followed by your video ID. -->
<div class="wb-video">
  <iframe
    src="about:blank#YOUR_YOUTUBE_EMBED_ADDRESS"
    title="YOUR_VIDEO_TITLE"
    loading="lazy"
    allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen></iframe>
</div>
<p class="wb-video-note"><a href="https://www.youtube.com/watch?v=YOUR_YOUTUBE_VIDEO_ID">Watch on YouTube</a></p>
