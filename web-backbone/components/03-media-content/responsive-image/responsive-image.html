<style>
.wb-img { margin: 0; }
.wb-img img { display: block; max-width: 100%; height: auto; border-radius: var(--wb-radius, 0); }
.wb-img figcaption { margin-top: 0.5rem; font-size: 0.875em; color: var(--wb-muted, inherit); }
</style>

<figure class="wb-img">
  <picture>
    <source type="image/webp"
            srcset="images/YOUR_IMAGE-480.webp 480w, images/YOUR_IMAGE-960.webp 960w, images/YOUR_IMAGE-1600.webp 1600w"
            sizes="(min-width: 60rem) 50vw, 100vw">
    <img src="images/YOUR_IMAGE-960.jpg"
         srcset="images/YOUR_IMAGE-480.jpg 480w, images/YOUR_IMAGE-960.jpg 960w, images/YOUR_IMAGE-1600.jpg 1600w"
         sizes="(min-width: 60rem) 50vw, 100vw"
         width="960" height="640"
         alt="YOUR_ALT_TEXT"
         loading="lazy" decoding="async">
  </picture>
  <figcaption>YOUR_CAPTION</figcaption>
</figure>
