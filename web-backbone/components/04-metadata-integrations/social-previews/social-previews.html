<!-- Inside <head>. Use absolute https addresses for og:url and og:image. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="YOUR_SITE_NAME">
<meta property="og:title" content="YOUR_PAGE_TITLE">
<meta property="og:description" content="YOUR_PAGE_DESCRIPTION">
<meta property="og:url" content="https://YOUR_DOMAIN/YOUR_PAGE_PATH">
<meta property="og:locale" content="en_US">

<meta property="og:image" content="https://YOUR_DOMAIN/images/YOUR_SHARE_IMAGE.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="YOUR_IMAGE_DESCRIPTION">

<!-- X (Twitter) card. Other twitter: tags fall back to the og: tags above. -->
<meta name="twitter:card" content="summary_large_image">
<!-- <meta name="twitter:site" content="@YOUR_ACCOUNT"> -->
