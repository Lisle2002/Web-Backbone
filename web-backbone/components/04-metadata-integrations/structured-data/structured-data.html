<!-- 1. LOCAL BUSINESS. Put on the page that describes the business (home or contact). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "YOUR_BUSINESS_NAME",
  "url": "https://YOUR_DOMAIN/",
  "telephone": "+YOUR_PHONE_WITH_COUNTRY_CODE",
  "image": "https://YOUR_DOMAIN/images/YOUR_BUSINESS_PHOTO.jpg",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "YOUR_STREET_ADDRESS",
    "addressLocality": "YOUR_CITY",
    "addressRegion": "YOUR_REGION",
    "postalCode": "YOUR_POSTAL_CODE",
    "addressCountry": "YOUR_TWO_LETTER_COUNTRY_CODE"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "YOUR_LATITUDE_AS_A_NUMBER",
    "longitude": "YOUR_LONGITUDE_AS_A_NUMBER"
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      "opens": "09:00",
      "closes": "17:00"
    },
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": "Saturday",
      "opens": "10:00",
      "closes": "14:00"
    }
  ]
}
</script>

<!-- 2. ORGANIZATION. Put on the home page or an About page. No property is required; add what is true. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "YOUR_ORGANIZATION_NAME",
  "url": "https://YOUR_DOMAIN/",
  "logo": "https://YOUR_DOMAIN/images/YOUR_LOGO.png",
  "sameAs": [
    "https://YOUR_PROFILE_URL_ONE",
    "https://YOUR_PROFILE_URL_TWO"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+YOUR_PHONE_WITH_COUNTRY_CODE",
    "email": "YOUR_EMAIL@YOUR_DOMAIN"
  }
}
</script>

<!-- 3. EVENT. Put on the page of ONE event. Dates need a time-zone offset. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": "YOUR_EVENT_NAME",
  "startDate": "2027-06-01T18:00:00-04:00",
  "endDate": "2027-06-01T19:30:00-04:00",
  "eventStatus": "https://schema.org/EventScheduled",
  "location": {
    "@type": "Place",
    "name": "YOUR_VENUE_NAME",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "YOUR_STREET_ADDRESS",
      "addressLocality": "YOUR_CITY",
      "addressRegion": "YOUR_REGION",
      "postalCode": "YOUR_POSTAL_CODE",
      "addressCountry": "YOUR_TWO_LETTER_COUNTRY_CODE"
    }
  },
  "description": "YOUR_EVENT_DESCRIPTION",
  "image": "https://YOUR_DOMAIN/images/YOUR_EVENT_IMAGE.jpg"
}
</script>

<!-- 4. BREADCRUMBS. Match the trail shown on the page. The last item may omit "item". -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://YOUR_DOMAIN/" },
    { "@type": "ListItem", "position": 2, "name": "YOUR_SECTION_NAME", "item": "https://YOUR_DOMAIN/YOUR_SECTION_PATH/" },
    { "@type": "ListItem", "position": 3, "name": "YOUR_PAGE_NAME" }
  ]
}
</script>

<!-- 5. FAQ PAGE. Valid markup, but see the limits: Google no longer shows FAQ rich results. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "YOUR_QUESTION_ONE",
      "acceptedAnswer": { "@type": "Answer", "text": "YOUR_ANSWER_ONE" }
    },
    {
      "@type": "Question",
      "name": "YOUR_QUESTION_TWO",
      "acceptedAnswer": { "@type": "Answer", "text": "YOUR_ANSWER_TWO" }
    }
  ]
}
</script>
